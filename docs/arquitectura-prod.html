<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquitectura Prod — SIGMETUM-A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f5; font-family: 'Geist', sans-serif; padding: 32px 24px; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 10px; color: #7a8399;
             letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-family: 'Instrument Serif', serif; font-size: 24px; color: #2d3142; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #4f5d75; margin-bottom: 20px; }
  .diagram-wrap { overflow-x: auto; }
</style>
</head>
<body>
<p class="eyebrow">SIGMETUM-A · INFRA · PROD</p>
<h1>Arquitectura de producción</h1>
<p class="subtitle">ALB + auto scaling 1–3 · HTTPS con ACM · DNS Route53 · eu-west-3</p>
<div class="diagram-wrap">
<svg viewBox="0 0 740 280" role="img" aria-labelledby="prod-title prod-desc"
     style="display:block;min-width:740px;width:100%;max-width:740px;">
  <title id="prod-title">Arquitectura Prod — SIGMETUM-A</title>
  <desc id="prod-desc">El browser carga la SPA desde Amplify. Las llamadas API van a través del ALB (terminador HTTPS con certificado ACM, apuntado por Route53). El ALB distribuye tráfico entre 1 y 3 instancias Beanstalk. Beanstalk accede a S3 por IAM.</desc>
  <defs>
    <marker id="p-arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4f5d75"/>
    </marker>
    <marker id="p-arr-link" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="740" height="280" fill="#f5f5f5"/>

  <!-- AWS zone -->
  <rect x="308" y="44" width="416" height="172" rx="8"
        fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="430" y="48" width="112" height="12" rx="2" fill="#f5f5f5"/>
  <text x="486" y="57" fill="rgba(45,49,66,0.40)" font-size="7"
        font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.14em">AWS · EU-WEST-3</text>

  <!-- ── ARROWS (before nodes) ── -->

  <!-- 1: Browser → Amplify (HTTPS) -->
  <line x1="116" y1="100" x2="156" y2="100"
        fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#p-arr-link)"/>

  <!-- 2: Amplify → ALB (HTTPS via Route53) -->
  <line x1="276" y1="100" x2="328" y2="100"
        fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#p-arr-link)"/>

  <!-- 3: ALB → Beanstalk ASG (HTTP forward) -->
  <line x1="456" y1="100" x2="500" y2="100"
        fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#p-arr)"/>

  <!-- HTTP label (above segment 3, 8px gap) -->
  <rect x="462" y="84" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="478" y="93" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace"
        text-anchor="middle" letter-spacing="0.10em">HTTP</text>

  <!-- 4: Beanstalk → S3 (IAM/SDK, dashed) -->
  <line x1="592" y1="120" x2="592" y2="164"
        fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"
        marker-end="url(#p-arr)"/>

  <!-- IAM label (right of dashed line) -->
  <rect x="600" y="133" width="28" height="12" rx="2" fill="#f5f5f5"/>
  <text x="614" y="142" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace"
        text-anchor="middle" letter-spacing="0.10em">IAM</text>

  <!-- ── NODES ── -->

  <!-- Browser (external) -->
  <rect x="20" y="80" width="96" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="20" y="80" width="96" height="40" rx="6"
        fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="68" y="96" fill="#2d3142" font-size="11" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">Browser</text>
  <text x="68" y="110" fill="#7a8399" font-size="8"
        font-family="'Geist Mono',monospace" text-anchor="middle">CLIENT</text>

  <!-- Amplify (step) -->
  <rect x="156" y="80" width="120" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="156" y="80" width="120" height="40" rx="6"
        fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
  <text x="216" y="96" fill="#2d3142" font-size="11" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">Frontend</text>
  <text x="216" y="110" fill="#7a8399" font-size="8"
        font-family="'Geist Mono',monospace" text-anchor="middle">AMPLIFY HOSTING</text>

  <!-- ALB (focal / accent) -->
  <rect x="328" y="80" width="128" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="328" y="80" width="128" height="40" rx="6"
        fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
  <text x="392" y="96" fill="#2d3142" font-size="11" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">ALB</text>
  <text x="392" y="110" fill="#7a8399" font-size="8"
        font-family="'Geist Mono',monospace" text-anchor="middle">HTTPS · ACM · ROUTE53</text>

  <!-- Beanstalk ASG (step) -->
  <rect x="500" y="80" width="196" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="500" y="80" width="196" height="40" rx="6"
        fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
  <text x="598" y="96" fill="#2d3142" font-size="11" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">Beanstalk Prod</text>
  <text x="598" y="110" fill="#7a8399" font-size="8"
        font-family="'Geist Mono',monospace" text-anchor="middle">t3.nano · 1–3 INSTANCES</text>

  <!-- S3 (store) -->
  <rect x="500" y="164" width="196" height="40" rx="6" fill="#f5f5f5"/>
  <rect x="500" y="164" width="196" height="40" rx="6"
        fill="#ececec" stroke="#2d3142" stroke-width="0.8"/>
  <text x="598" y="180" fill="#2d3142" font-size="11" font-weight="600"
        font-family="'Geist',sans-serif" text-anchor="middle">S3 Assets</text>
  <text x="598" y="194" fill="#7a8399" font-size="8"
        font-family="'Geist Mono',monospace" text-anchor="middle">sigmetum-app-assets-prod</text>

  <!-- ── LEGEND ── -->
  <rect x="0" y="220" width="740" height="60" fill="#ececec"/>
  <line x1="0" y1="220" x2="740" y2="220" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

  <!-- Row 1 -->
  <line x1="24" y1="240" x2="48" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#p-arr-link)"/>
  <text x="56" y="244" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif">HTTPS</text>

  <line x1="136" y1="240" x2="160" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#p-arr)"/>
  <text x="168" y="244" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif">HTTP forward</text>

  <line x1="280" y1="240" x2="304" y2="240" stroke="#4f5d75" stroke-width="1"
        stroke-dasharray="4,3" marker-end="url(#p-arr)"/>
  <text x="312" y="244" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif">IAM / SDK</text>

  <rect x="420" y="232" width="28" height="16" rx="4"
        fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="456" y="244" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif">terminador HTTPS (focal)</text>

  <!-- Row 2 -->
  <rect x="24" y="256" width="28" height="14" rx="4"
        fill="#ececec" stroke="#2d3142" stroke-width="0.8"/>
  <text x="60" y="267" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif">almacén S3</text>

  <rect x="152" y="256" width="28" height="14" rx="4"
        fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="188" y="267" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif">zona AWS</text>

  <rect x="288" y="256" width="28" height="14" rx="4"
        fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="324" y="267" fill="#2d3142" font-size="9" font-family="'Geist',sans-serif">cliente externo</text>

</svg>
</div>
</body>
</html>
